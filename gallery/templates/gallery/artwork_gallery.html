{% extends 'base.html' %}

{% block title %}Artworks — RaigonOS{% endblock %}

{% block content %}
  <span class="eyebrow">Gallery</span>
  <h1>Artworks</h1>
  <p><a href="{% url 'gallery:collection_list' %}">View by Collection &rarr;</a></p>

  <ul class="card-grid">
    {% for artwork in artworks %}
      <li class="card">
        <a href="{% url 'gallery:artwork_detail' artwork.pk %}">
          <div class="card-image">
            <img src="{{ artwork.image.url }}" alt="{{ artwork.title }}">
          </div>
          <div class="card-body">
            <span class="card-title">{{ artwork.title }}</span>
          </div>
        </a>
      </li>
    {% empty %}
      <li class="card-empty">No artworks published yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
