<li class="dash-artwork-row">
  <a href="{% url 'gallery:artwork_manage' artwork.pk %}" class="dash-artwork-link">
    {% if artwork.image %}
      <img src="{{ artwork.image.url }}" alt="" class="dash-thumb">
    {% else %}
      <span class="dash-thumb-placeholder"></span>
    {% endif %}
    <span class="dash-artwork-title">{{ artwork.title }}</span>
    {% if show_collection %}
      <span class="dash-artwork-collection">{{ artwork.collection.title }}</span>
    {% endif %}
    <svg class="dash-icon dash-artwork-chevron"><use href="#icon-chevron-right"></use></svg>
  </a>
  <span class="dash-artwork-actions">
    <a href="{% url 'gallery:artwork_update' artwork.pk %}" class="dash-icon-btn" title="Edit" aria-label="Edit Artwork">
      <svg class="dash-icon"><use href="#icon-edit"></use></svg>
    </a>
    <a href="{% url 'gallery:artwork_delete' artwork.pk %}" class="dash-icon-btn dash-icon-btn-danger" title="Delete" aria-label="Delete Artwork">
      <svg class="dash-icon"><use href="#icon-trash"></use></svg>
    </a>
  </span>
</li>
