{% extends 'base.html' %}

{% block title %}Delete Artwork — RaigonOS{% endblock %}

{% block content %}
  <h1>Delete "{{ artwork.title }}"?</h1>
  <p>This cannot be undone.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
  </form>

  <p class="back-link"><a href="{% url 'gallery:dashboard' %}">Cancel</a></p>
{% endblock %}
