{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RaigonOS{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header>
    <nav>
      <a href="{% url 'gallery:collection_list' %}" class="wordmark">RaigonOS</a>
      <div class="nav-auth">
        {% if user.is_authenticated %}
          <a href="{% url 'gallery:dashboard' %}">Dashboard</a>
          <span>{{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="link-button">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">Log in</a>
          <a href="{% url 'signup' %}">Sign up</a>
        {% endif %}
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>&copy; {% now "Y" %} Railson Gon&ccedil;alves</p>
  </footer>
</body>
</html>
