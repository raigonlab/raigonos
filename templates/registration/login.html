{% extends 'base.html' %}

{% block title %}Log in — RaigonOS{% endblock %}

{% block content %}
  <h1>Log in</h1>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
  <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
